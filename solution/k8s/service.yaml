# k8s/service.yaml — stable virtual IP + DNS name "demo" in front of the app Pods.
#
#   kubectl apply -f k8s/service.yaml
#   kubectl get service demo
#   kubectl get endpoints demo        # <none> here means selector/label mismatch
#   kubectl port-forward service/demo 8000:80
apiVersion: v1
kind: Service
metadata:
  name: demo                    # becomes the DNS name: demo, demo.default.svc.cluster.local
spec:
  type: ClusterIP               # reachable inside the cluster only (default)
  selector:
    app: demo                   # which Pods? the ones labeled app=demo
  ports:
    - port: 80                  # the Service's own port
      targetPort: 8000          # the containerPort to forward to
