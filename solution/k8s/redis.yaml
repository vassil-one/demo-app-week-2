# k8s/redis.yaml — Redis as its own Deployment + Service.
# Two objects in one file, separated by "---". The Service name "redis" is what
# the app's REDIS_HOST points at, exactly like the Compose service name.
#
#   kubectl apply -f k8s/redis.yaml
#
# No volume yet: the data lives in the Pod's filesystem and disappears when the
# Pod is replaced. Compare with the named volume in compose.yaml — persistent
# storage in Kubernetes (PersistentVolumes) is a Week 3 discussion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine   # public image — the cluster pulls it itself
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
